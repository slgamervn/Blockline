name: Website validation

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "favicon.svg"
      - "README.md"
      - "README.vi.md"
      - "scripts/check-site.mjs"
      - "scripts/check-website.mjs"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "favicon.svg"
      - "README.md"
      - "README.vi.md"
      - "scripts/check-site.mjs"
      - "scripts/check-website.mjs"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate landing page and workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate GitHub Actions workflow YAML
        run: |
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.parse_file(file); puts "Valid YAML: #{file}" }' .github/workflows/*.yml
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check HTML links, scripts, CSS, and motion safeguards
        run: node --check scripts/check-website.mjs && node scripts/check-website.mjs
