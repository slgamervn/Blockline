name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HAS_SIGNING_KEY: ${{ secrets.BLOCKLINE_KEYSTORE_BASE64 != '' }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept remaining licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14.6

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Prepare stable signing key
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.BLOCKLINE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/blockline-upload.jks"
          echo "BLOCKLINE_KEYSTORE_PATH=$RUNNER_TEMP/blockline-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env:
          BLOCKLINE_KEYSTORE_PASSWORD: ${{ secrets.BLOCKLINE_KEYSTORE_PASSWORD }}
          BLOCKLINE_KEY_ALIAS: ${{ secrets.BLOCKLINE_KEY_ALIAS }}
          BLOCKLINE_KEY_PASSWORD: ${{ secrets.BLOCKLINE_KEY_PASSWORD }}
        run: gradle assembleRelease -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=${{ env.VERSION_NAME }} --stacktrace --no-daemon

      - name: Build debug APK (signing setup required for upgrade installs)
        if: ${{ env.HAS_SIGNING_KEY != 'true' }}
        run: gradle assembleDebug -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=${{ env.VERSION_NAME }} --stacktrace --no-daemon

      - name: Prepare versioned APK
        run: |
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "Blockline-v${VERSION_NAME}.apk"
            echo "APK_BUILD_TYPE=Signed release" >> "$GITHUB_ENV"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "Blockline-v${VERSION_NAME}.apk"
            echo "APK_BUILD_TYPE=Debug (unsigned release key not configured)" >> "$GITHUB_ENV"
          fi
          echo "APK_FILE=Blockline-v${VERSION_NAME}.apk" >> "$GITHUB_ENV"

      - name: Generate release notes from actual commits
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          PREVIOUS_TAG="$(git tag --list 'v*' --sort=-version:refname | grep -v "^v${VERSION_NAME}$" | head -n 1)"
          {
            echo "# Blockline v${VERSION_NAME}"
            echo
            echo "## Build"
            echo "- Version: ${VERSION_NAME}"
            echo "- Build number: ${{ github.run_number }}"
            echo "- APK type: ${APK_BUILD_TYPE}"
            echo "- Commit: ${GITHUB_SHA}"
            echo
            echo "## Changes in this build"
            if [ -n "$PREVIOUS_TAG" ]; then
              git log "${PREVIOUS_TAG}..HEAD" --no-merges --pretty=format:'- %s (`%h`)' | head -n 80
            else
              git log -n 20 --no-merges --pretty=format:'- %s (`%h`)'
            fi
            echo
            echo
            echo "## Installation"
            echo "- Download `Blockline-v${VERSION_NAME}.apk` from the Assets section."
            echo "- If this is a debug build, installing over an APK signed with a different key may require uninstalling the older app first. Back up project files before doing so."
          } > RELEASE_NOTES.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: Blockline-v${{ env.VERSION_NAME }}-apk
          path: Blockline-v${{ env.VERSION_NAME }}.apk
          if-no-files-found: error

      - name: Create Release with versioned APK and change summary
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Blockline v${{ env.VERSION_NAME }}
          body_path: RELEASE_NOTES.md
          files: Blockline-v${{ env.VERSION_NAME }}.apk
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
