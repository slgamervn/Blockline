name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HAS_SIGNING_KEY: ${{ secrets.BLOCKLINE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine app version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"
          fi
          SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! "$VERSION_NAME" =~ $SEMVER_REGEX ]]; then
            echo "::error::VERSION_NAME must follow Semantic Versioning, for example 0.1.412 or 1.2.3-rc.1+build.5."
            exit 1
          fi
          PRERELEASE="${BASH_REMATCH[5]}"
          if [[ -n "$PRERELEASE" ]]; then
            IFS='.' read -r -a prerelease_identifiers <<< "$PRERELEASE"
            for identifier in "${prerelease_identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" =~ ^0[0-9]+$ ]]; then
                echo "::error::Numeric prerelease identifiers must not contain leading zeroes: $identifier"
                exit 1
              fi
            done
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate GitHub Actions workflow YAML
        run: |
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.parse_file(file); puts "Valid YAML: #{file}" }' .github/workflows/*.yml

      - name: Validate website and Android translation resources
        run: |
          node scripts/check-site.mjs
          node scripts/check-website.mjs
          node scripts/check-android-translations.mjs
          node scripts/check-addon-completion-schema.mjs

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Validate release signing configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BLOCKLINE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BLOCKLINE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BLOCKLINE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BLOCKLINE_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::notice::Signing secrets are not configured; this run will produce a debug APK artifact only."
            exit 0
          fi
          if [[ -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Keystore Base64 is configured, but one or more required signing secrets are missing."
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14.6

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Prepare stable signing key
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.BLOCKLINE_KEYSTORE_BASE64 }}
        run: |
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/blockline-upload.jks"; then
            echo "::error::BLOCKLINE_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi
          if [[ ! -s "$RUNNER_TEMP/blockline-upload.jks" ]]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi
          echo "BLOCKLINE_KEYSTORE_PATH=$RUNNER_TEMP/blockline-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          BLOCKLINE_KEYSTORE_PASSWORD: ${{ secrets.BLOCKLINE_KEYSTORE_PASSWORD }}
          BLOCKLINE_KEY_ALIAS: ${{ secrets.BLOCKLINE_KEY_ALIAS }}
          BLOCKLINE_KEY_PASSWORD: ${{ secrets.BLOCKLINE_KEY_PASSWORD }}
        run: gradle assembleRelease -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME="$VERSION_NAME" --stacktrace --no-daemon

      - name: Build debug APK (signing setup required for upgrade installs)
        if: ${{ env.HAS_SIGNING_KEY != 'true' }}
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: gradle assembleDebug -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME="$VERSION_NAME" --stacktrace --no-daemon

      - name: Prepare versioned APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "Blockline-v${VERSION_NAME}.apk"
            echo "APK_BUILD_TYPE=Signed release" >> "$GITHUB_ENV"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "Blockline-v${VERSION_NAME}.apk"
            echo "APK_BUILD_TYPE=Debug (unsigned release key not configured)" >> "$GITHUB_ENV"
          fi
          echo "APK_FILE=Blockline-v${VERSION_NAME}.apk" >> "$GITHUB_ENV"

      - name: Generate release notes from actual commits
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          PREVIOUS_TAG="$(git tag --list 'v*' --sort=-version:refname | grep -v "^v${VERSION_NAME}$" | head -n 1)"
          {
            echo "## Build"
            echo "- Version: ${VERSION_NAME}"
            echo "- Build number: ${{ github.run_number }}"
            echo "- APK type: ${APK_BUILD_TYPE}"
            echo "- Commit: ${GITHUB_SHA}"
            echo
            echo "## Changes in this build"
            if [ -n "$PREVIOUS_TAG" ]; then
              git log "${PREVIOUS_TAG}..HEAD" --no-merges --pretty=format:'- %s (`%h`)' | head -n 80
            else
              git log -n 20 --no-merges --pretty=format:'- %s (`%h`)'
            fi
            echo
            echo
            echo "## Installation"
            printf '%s\n' "- Download \`Blockline-v${VERSION_NAME}.apk\` from the Assets section."
            echo "- If this is a debug build, installing over an APK signed with a different key may require uninstalling the older app first. Back up project files before doing so."
          } > RELEASE_NOTES.md
          if grep -Fq "## Blockline v${VERSION_NAME}" RELEASE_NOTES.md || grep -Fq "# Blockline v${VERSION_NAME}" RELEASE_NOTES.md; then
            echo "Release notes must not repeat the GitHub Release title." >&2
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: Blockline-v${{ steps.version.outputs.version_name }}-apk
          path: Blockline-v${{ steps.version.outputs.version_name }}.apk
          if-no-files-found: error

      - name: Explain why a stable release was skipped
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))) && env.HAS_SIGNING_KEY != 'true' }}
        run: |
          {
            echo "## Stable GitHub Release not created"
            echo
            echo "The versioned APK was uploaded as a workflow artifact, but it was not published as the latest stable release because signing secrets are not configured."
            echo "Configure BLOCKLINE_KEYSTORE_BASE64, BLOCKLINE_KEYSTORE_PASSWORD, BLOCKLINE_KEY_ALIAS and BLOCKLINE_KEY_PASSWORD, then run the workflow again or push a valid vX.Y.Z tag."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create Release with versioned APK and change summary
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))) && env.HAS_SIGNING_KEY == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version_name) }}
          target_commitish: ${{ github.sha }}
          name: Blockline v${{ steps.version.outputs.version_name }}
          body_path: RELEASE_NOTES.md
          files: Blockline-v${{ steps.version.outputs.version_name }}.apk
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
